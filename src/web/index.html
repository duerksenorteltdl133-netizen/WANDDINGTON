<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waddington</title>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }
textarea, input { font-family: inherit; }
input[type=file] { display: none; }

/* ── Tokens ── */
:root { --sidebar-w: 260px; --radius: 12px; --rsm: 8px; --tr: .18s ease; }

/* ── Dark (default in auto) ── */
[data-theme="dark"], [data-theme="auto"] {
  --bg:#212121; --sb:#171717; --sur:#2f2f2f; --sur2:#3a3a3a; --bdr:#3a3a3a;
  --tx:#ececec; --txm:#8e8e8e; --txf:#4a4a4a;
  --ubg:#2f2f2f; --acc:#10a37f; --acc2:#0d8f6e; --danger:#ef4444;
  --ibg:#2f2f2f; --ibdr:#4a4a4a; --scr:#3a3a3a; --sha:rgba(0,0,0,.4);
}
[data-theme="light"] {
  --bg:#fff; --sb:#f9f9f9; --sur:#f1f1f1; --sur2:#e8e8e8; --bdr:#e5e5e5;
  --tx:#0d0d0d; --txm:#666; --txf:#ccc;
  --ubg:#f1f1f1; --acc:#10a37f; --acc2:#0d8f6e; --danger:#ef4444;
  --ibg:#fff; --ibdr:#d1d1d1; --scr:#d1d1d1; --sha:rgba(0,0,0,.1);
}
@media(prefers-color-scheme:light){
  [data-theme="auto"]{
    --bg:#fff;--sb:#f9f9f9;--sur:#f1f1f1;--sur2:#e8e8e8;--bdr:#e5e5e5;
    --tx:#0d0d0d;--txm:#666;--txf:#ccc;
    --ubg:#f1f1f1;--acc:#10a37f;--acc2:#0d8f6e;--danger:#ef4444;
    --ibg:#fff;--ibdr:#d1d1d1;--scr:#d1d1d1;--sha:rgba(0,0,0,.1);
  }
}

/* ── App shell ── */
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.6;}
#app{display:flex;height:100vh;overflow:hidden;}

/* ── Sidebar ── */
#sidebar{
  width:var(--sidebar-w);background:var(--sb);border-right:1px solid var(--bdr);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;
  transition:width var(--tr),border-color var(--tr);
}
#app.sb-off #sidebar{width:0;border-right-color:transparent;}

#sb-top{padding:10px 8px 6px;display:flex;align-items:center;gap:4px;flex-shrink:0;}
#new-btn{
  flex:1;display:flex;align-items:center;gap:7px;
  padding:7px 10px;border-radius:var(--rsm);
  color:var(--txm);font-size:13px;font-weight:500;
  transition:background var(--tr),color var(--tr);white-space:nowrap;overflow:hidden;
}
#new-btn:hover{background:var(--sur2);color:var(--tx);}

#sb-search{padding:4px 8px 6px;}
#conv-search{
  width:100%;background:var(--sur);border:1px solid var(--bdr);
  border-radius:var(--rsm);color:var(--tx);font-size:13px;
  padding:6px 10px;outline:none;transition:border-color var(--tr);
}
#conv-search:focus{border-color:var(--acc);}
#conv-search::placeholder{color:var(--txm);}

#sb-section{padding:4px 12px 2px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--txf);}

#conv-list{flex:1;overflow-y:auto;padding:0 4px;}
#conv-list::-webkit-scrollbar{width:4px;}
#conv-list::-webkit-scrollbar-thumb{background:var(--scr);border-radius:2px;}

/* conversation item */
.ci{
  display:flex;align-items:center;gap:7px;
  padding:7px 8px;border-radius:var(--rsm);cursor:pointer;
  transition:background var(--tr);position:relative;min-width:0;
}
.ci:hover{background:var(--sur2);}
.ci.active{background:var(--sur);}
.ci:hover .ci-del{opacity:1;}

.ci-ico{flex-shrink:0;color:var(--txm);}
.ci-name{
  flex:1;font-size:13px;color:var(--tx);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.ci-name-input{
  flex:1;background:transparent;border:none;border-bottom:1px solid var(--acc);
  color:var(--tx);font-size:13px;outline:none;padding:0;min-width:0;
}
.ci-del{
  flex-shrink:0;width:20px;height:20px;border-radius:4px;
  color:var(--txm);opacity:0;display:flex;align-items:center;justify-content:center;
  transition:opacity var(--tr),background var(--tr),color var(--tr);
}
.ci-del:hover{background:var(--sur2);color:var(--danger);}

/* experiments section */
#exp-section{border-top:1px solid var(--bdr);flex-shrink:0;}
#exp-hdr{
  padding:6px 12px 5px;display:flex;align-items:center;justify-content:space-between;
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;
  color:var(--txf);cursor:pointer;-webkit-user-select:none;user-select:none;
  transition:color var(--tr);
}
#exp-hdr:hover{color:var(--txm);}
#exp-chev{font-size:10px;transition:transform var(--tr);}
#exp-section.open #exp-chev{transform:rotate(90deg);}
#exp-list{
  overflow-y:auto;max-height:0;
  transition:max-height .22s ease;padding:0 4px;
}
#exp-section.open #exp-list{max-height:200px;}
#exp-list::-webkit-scrollbar{width:4px;}
#exp-list::-webkit-scrollbar-thumb{background:var(--scr);border-radius:2px;}

.ei{
  display:flex;align-items:baseline;gap:6px;
  padding:5px 8px;border-radius:var(--rsm);cursor:pointer;
  font-size:12px;transition:background var(--tr);position:relative;
}
.ei:hover{background:var(--sur2);}
.ei-gene{font-weight:600;color:var(--tx);flex-shrink:0;}
.ei-model{color:var(--txm);flex-shrink:0;}
.ei-metric{color:var(--acc);font-weight:500;flex-shrink:0;}
.ei-date{color:var(--txf);font-size:11px;margin-left:auto;flex-shrink:0;}
.ei-del{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;border-radius:3px;color:var(--txf);
  display:none;align-items:center;justify-content:center;font-size:10px;
  transition:background var(--tr),color var(--tr);
}
.ei:hover .ei-del{display:flex;}
.ei-del:hover{background:var(--sur2);color:var(--danger);}

/* sidebar footer */
#sb-foot{padding:8px 8px 12px;border-top:1px solid var(--bdr);}
#theme-btn{
  display:flex;align-items:center;gap:9px;
  padding:7px 8px;border-radius:var(--rsm);width:100%;
  color:var(--txm);font-size:13px;transition:background var(--tr),color var(--tr);
}
#theme-btn:hover{background:var(--sur2);color:var(--tx);}

/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* ── Topbar ── */
#topbar{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;border-bottom:1px solid var(--bdr);
  flex-shrink:0;min-height:52px;
}
/* toggle always leftmost, always visible */
#sb-toggle{
  width:34px;height:34px;flex-shrink:0;
  border-radius:var(--rsm);color:var(--txm);
  display:flex;align-items:center;justify-content:center;
  transition:background var(--tr),color var(--tr);
}
#sb-toggle:hover{background:var(--sur);color:var(--tx);}

#model-badge{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--tx);flex:1;min-width:0;}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--txf);transition:background var(--tr);}
.sdot.ok{background:#22c55e;}
.sdot.busy{background:#f59e0b;animation:pulse 1s infinite;}
#model-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── Messages ── */
#msgs-wrap{flex:1;overflow-y:auto;scroll-behavior:smooth;}
#msgs-wrap::-webkit-scrollbar{width:6px;}
#msgs-wrap::-webkit-scrollbar-thumb{background:var(--scr);border-radius:3px;}
#msgs-wrap::-webkit-scrollbar-track{background:transparent;}
#msgs{max-width:780px;margin:0 auto;padding:20px 16px 8px;}

/* empty / welcome */
#empty{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;padding:40px 20px;text-align:center;
}
#empty h1{font-size:28px;font-weight:600;margin-bottom:8px;}
#empty p{font-size:15px;color:var(--txm);max-width:480px;margin-bottom:36px;}
#suggs{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:540px;width:100%;}
.sugg{
  background:var(--sur);border:1px solid var(--bdr);border-radius:var(--radius);
  padding:14px 16px;text-align:left;cursor:pointer;
  transition:background var(--tr),border-color var(--tr),transform .1s;
}
.sugg:hover{background:var(--sur2);border-color:var(--acc);transform:translateY(-1px);}
.sugg .s-ico{font-size:18px;margin-bottom:5px;}
.sugg .s-ttl{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:2px;}
.sugg .s-sub{font-size:12px;color:var(--txm);}

/* message rows */
.mrow{display:flex;flex-direction:column;margin-bottom:20px;animation:fadeIn .2s ease;}
.mrow.user{align-items:flex-end;}
.mrow.assistant{align-items:flex-start;}
.mhdr{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.mav{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;
}
.mrow.user .mav{background:var(--acc);color:#fff;}
.mrow.assistant .mav{background:#19c37d;color:#fff;}
.mauth{font-size:13px;font-weight:600;color:var(--tx);}
.mbub{
  max-width:85%;padding:11px 15px;border-radius:18px;
  font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
}
.mrow.user .mbub{
  background:var(--ubg);border:1px solid var(--bdr);
  border-bottom-right-radius:4px;color:var(--tx);
}
.mrow.assistant .mbub{background:transparent;color:var(--tx);padding:0;max-width:100%;}

/* attachment chip in bubble */
.att-chip{
  display:flex;align-items:center;gap:7px;
  padding:7px 10px;background:var(--sur);border:1px solid var(--bdr);
  border-radius:var(--rsm);margin-bottom:7px;font-size:12px;
}
.att-chip .att-name{font-weight:500;color:var(--tx);}

/* tool pill */
.tpill{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;background:var(--sur);border:1px solid var(--bdr);
  border-radius:20px;font-size:12px;color:var(--txm);margin-bottom:7px;
}
.tpill.done{border-color:#22c55e44;color:#22c55e;}
.tpill.err{border-color:#ef444444;color:#ef4444;}
.spin{animation:spin 1s linear infinite;}

/* streaming cursor — appended as a real inline element inside .mbub */
.stream-cur{
  display:inline-block;width:2px;height:1em;
  background:var(--tx);margin-left:2px;vertical-align:text-bottom;
  animation:blink .8s infinite;
}

/* ── Input ── */
#inp-wrap{flex-shrink:0;padding:12px 16px 18px;}
#inp-box{
  max-width:780px;margin:0 auto;
  background:var(--ibg);border:1px solid var(--ibdr);
  border-radius:16px;box-shadow:0 2px 12px var(--sha);
  transition:border-color var(--tr);
}
#inp-box:focus-within{border-color:var(--acc);}

/* pending attachment chips */
#att-chips{display:none;flex-wrap:wrap;gap:5px;padding:9px 12px 0;}
#att-chips.has{display:flex;}
.afc{
  display:flex;align-items:center;gap:4px;
  padding:3px 8px;background:var(--sur);border:1px solid var(--bdr);
  border-radius:6px;font-size:12px;color:var(--tx);
}
.afc-rm{color:var(--txm);margin-left:2px;line-height:1;cursor:pointer;transition:color var(--tr);}
.afc-rm:hover{color:var(--danger);}

#ta-row{display:flex;align-items:flex-end;padding:9px 11px;gap:7px;}

/* + button */
#att-btn{
  width:32px;height:32px;border-radius:7px;color:var(--txm);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  align-self:flex-end;transition:background var(--tr),color var(--tr);position:relative;
}
#att-btn:hover{background:var(--sur);color:var(--tx);}

#att-menu{
  position:absolute;bottom:40px;left:0;
  background:var(--sur);border:1px solid var(--bdr);
  border-radius:var(--radius);box-shadow:0 4px 20px var(--sha);
  min-width:172px;z-index:100;display:none;overflow:hidden;
}
#att-menu.open{display:block;}
.aopt{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;font-size:13px;color:var(--tx);cursor:pointer;
  transition:background var(--tr);
}
.aopt:hover{background:var(--sur2);}
.aopt svg{color:var(--txm);flex-shrink:0;}

#msg-ta{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--tx);font-size:15px;line-height:1.5;
  resize:none;min-height:24px;max-height:200px;padding:3px 0;
}
#msg-ta::placeholder{color:var(--txm);}

#send-btn{
  width:32px;height:32px;border-radius:7px;background:var(--acc);
  color:#fff;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;align-self:flex-end;
  transition:background var(--tr),opacity var(--tr);
}
#send-btn:hover:not(:disabled){background:var(--acc2);}
#send-btn:disabled{opacity:.35;cursor:default;}
#send-btn.stop{background:#ef4444;}
#send-btn.stop:hover{background:#dc2626;}

#inp-hint{
  text-align:center;font-size:11px;color:var(--txf);
  margin-top:5px;max-width:780px;margin-left:auto;margin-right:auto;
}

/* ── Utilities ── */
.d-none{display:none!important;}
#att-wrap{position:relative;flex-shrink:0;align-self:flex-end;}

/* ── Animations ── */
@keyframes blink{0%,50%{opacity:1;}51%,100%{opacity:0;}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ── Markdown body ── */
.md-body{line-height:1.72;word-break:break-word;}
.md-body>*+*{margin-top:.65em;}
.md-body h1,.md-body h2,.md-body h3,.md-body h4{font-weight:700;line-height:1.3;margin-top:1.3em;margin-bottom:.3em;}
.md-body h1{font-size:1.35em;}
.md-body h2{font-size:1.15em;}
.md-body h3{font-size:1.02em;}
.md-body h4{font-size:.95em;color:var(--txm);}
.md-body p{margin-bottom:.5em;}
.md-body ul,.md-body ol{padding-left:1.55em;margin-bottom:.5em;}
.md-body li+li{margin-top:.22em;}
.md-body li p{margin-bottom:.25em;}

/* inline code */
.md-body :not(pre)>code{
  background:var(--sur);border:1px solid var(--bdr);
  border-radius:4px;padding:1px 5px;
  font-size:.85em;font-family:'Fira Code','Cascadia Code','Consolas',monospace;
}
/* code block */
.md-body pre{
  position:relative;margin:.65em 0;
  background:var(--sur);border:1px solid var(--bdr);
  border-radius:var(--rsm);overflow:hidden;
}
.md-body pre code.hljs{
  display:block;overflow-x:auto;
  padding:13px 16px;font-size:12.5px;
  font-family:'Fira Code','Cascadia Code','Consolas',monospace;
  background:transparent!important;line-height:1.55;
}
/* copy button */
.cp-btn{
  position:absolute;top:7px;right:8px;
  padding:2px 8px;border-radius:5px;
  background:var(--sur2);border:1px solid var(--bdr);
  color:var(--txm);font-size:11px;cursor:pointer;
  opacity:0;transition:opacity var(--tr),background var(--tr),color var(--tr);
}
.md-body pre:hover .cp-btn{opacity:1;}
.cp-btn:hover{background:var(--acc);color:#fff;border-color:var(--acc);}
.cp-btn.copied{background:#22c55e;color:#fff;border-color:#22c55e;opacity:1;}

/* table */
.md-body table{border-collapse:collapse;width:100%;margin:.65em 0;font-size:13px;display:block;overflow-x:auto;}
.md-body th,.md-body td{padding:7px 12px;border:1px solid var(--bdr);text-align:left;}
.md-body th{background:var(--sur);font-weight:600;}
.md-body tbody tr:nth-child(even){background:var(--sur);}

/* blockquote */
.md-body blockquote{
  border-left:3px solid var(--acc);
  padding:.35em .9em;margin:.65em 0;
  color:var(--txm);
}
.md-body blockquote p{margin-bottom:0;}

/* links & misc */
.md-body a{color:var(--acc);text-decoration:none;}
.md-body a:hover{text-decoration:underline;}
.md-body hr{border:none;border-top:1px solid var(--bdr);margin:.9em 0;}
.md-body strong{font-weight:700;}
.md-body em{font-style:italic;}
</style>

<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/typescript.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/yaml.min.js"></script>

<body>
<div id="app">

  <!-- ── Sidebar ── -->
  <aside id="sidebar">
    <div id="sb-top">
      <button type="button" id="new-btn" title="New conversation">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New conversation
      </button>
    </div>

    <div id="sb-search">
      <input id="conv-search" type="text" placeholder="Search…" autocomplete="off"/>
    </div>

    <div id="sb-section">Conversations</div>
    <div id="conv-list"></div>

    <div id="exp-section">
      <div id="exp-hdr">
        <span>Experiments</span>
        <span id="exp-chev">›</span>
      </div>
      <div id="exp-list"></div>
    </div>

    <div id="sb-foot">
      <button type="button" id="theme-btn">
        <span id="theme-ico">🌓</span>
        <span id="theme-lbl">Auto theme</span>
      </button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main id="main">
    <div id="topbar">
      <!-- always-visible sidebar toggle (leftmost) -->
      <button type="button" id="sb-toggle" title="Toggle sidebar">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </button>

      <div id="model-badge">
        <span class="sdot" id="sdot"></span>
        <span id="model-name">Waddington</span>
      </div>
    </div>

    <div id="msgs-wrap">
      <div id="empty">
        <h1>Waddington</h1>
        <p>Single-cell gene perturbation AI research agent. Ask about models, run experiments, or search literature.</p>
        <div id="suggs">
          <button type="button" class="sugg" data-p="/perturb CEBPE --model gears">
            <div class="s-ico">🧬</div>
            <div class="s-ttl">Gene perturbation</div>
            <div class="s-sub">Predict KO effect with GEARS</div>
          </button>
          <button type="button" class="sugg" data-p="/discuss https://arxiv.org/abs/2206.04679">
            <div class="s-ico">📄</div>
            <div class="s-ttl">Read a paper</div>
            <div class="s-sub">Load, discuss &amp; extract methods</div>
          </button>
          <button type="button" class="sugg" data-p="/benchmark gears scgpt --dataset norman2019">
            <div class="s-ico">📊</div>
            <div class="s-ttl">Benchmark models</div>
            <div class="s-sub">Compare GEARS vs scGPT</div>
          </button>
          <button type="button" class="sugg" data-p="/model list">
            <div class="s-ico">🗂️</div>
            <div class="s-ttl">List installed models</div>
            <div class="s-sub">View registry &amp; conda envs</div>
          </button>
        </div>
      </div>
      <div id="msgs" class="d-none"></div>
    </div>

    <div id="inp-wrap">
      <div id="inp-box">
        <div id="att-chips"></div>
        <div id="ta-row">
          <div id="att-wrap">
            <button type="button" id="att-btn" title="Attach file">
              <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>
            <div id="att-menu">
              <label class="aopt" for="fi-img">
                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
                Image
              </label>
              <label class="aopt" for="fi-txt">
                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <line x1="16" y1="13" x2="8" y2="13"/>
                  <line x1="16" y1="17" x2="8" y2="17"/>

          <input type="file" id="fi-img" accept="image/*"/>
          <input type="file" id="fi-txt" accept=".txt,.md,.py,.r,.R,.csv,.tsv,.json,.yaml,.yml,.sh,.ipynb"/>

          <textarea id="msg-ta" rows="1"
            placeholder="Message Waddington… (Enter to send, Shift+Enter for newline)"></textarea>

          <button type="button" id="send-btn" disabled title="Send">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>

        </div>
      </div>
      <div id="inp-hint">Enter ↵ to send &nbsp;·&nbsp; Shift+Enter for new line</div>
    </div>
  </main>
</div>

<script>
(function(){
'use strict';

var PORT    = __PORT__;
var WS_URL  = 'ws://localhost:' + PORT + '/ws';
var API     = 'http://localhost:' + PORT + '/api';
var LS_KEY  = 'wad-convs-v2';   // kept only for one-time migration

/* ── Server API helpers ── */
function apiFetch(path, opts){
  return fetch(API + path, opts).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
}
function jpost(path, body){ return apiFetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
function jpatch(path, body){ return apiFetch(path,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
function jdel(path){ return apiFetch(path,{method:'DELETE'}); }

function syncConvMeta(conv, patch){
  jpatch('/convs/'+conv.id, patch).catch(function(){});
}
function syncMsg(convId, msg){
  jpost('/convs/'+convId+'/messages', msg).catch(function(){});
}
function apiCreateConv(conv){
  return jpost('/convs',{id:conv.id,name:conv.name,sessionFile:conv.sessionFile}).catch(function(){});
}
function apiDeleteConv(id){
  return jdel('/convs/'+id).catch(function(){});
}

/* ── Experiments ── */
var experiments = [];
var expListEl   = document.getElementById('exp-list');
var expSection  = document.getElementById('exp-section');

function loadExperiments(){
  apiFetch('/experiments?limit=30').then(function(data){
    experiments = data;
    renderExpList();
    if(experiments.length) expSection.classList.add('open');
  }).catch(function(){});
}

function renderExpList(){
  expListEl.innerHTML='';
  if(!experiments.length){ expSection.classList.remove('open'); return; }
  experiments.forEach(function(e){
    var m = {};
    try{ m=JSON.parse(e.metrics); }catch(_){}
    var pde = m.pearson_de!=null ? m.pearson_de : (m.pearson!=null ? m.pearson : null);
    var metricStr = pde!=null ? pde.toFixed(3)+' DE' : '';
    var d = new Date(e.created_at);
    var dateStr = (d.getMonth()+1)+'/'+(d.getDate());
    var row = document.createElement('div');
    row.className='ei';
    row.dataset.convId = e.conv_id||'';
    row.innerHTML=
      '<span class="ei-gene">'+(e.gene||'—')+'</span>'+
      '<span class="ei-model">'+(e.model||'')+'</span>'+
      (metricStr?'<span class="ei-metric">'+metricStr+'</span>':'')+
      '<span class="ei-date">'+dateStr+'</span>'+
      '<span class="ei-del" data-eid="'+e.id+'">✕</span>';
    expListEl.appendChild(row);
  });
}

expListEl.addEventListener('click', function(ev){
  var del = ev.target.closest('.ei-del');
  if(del){
    ev.stopPropagation();
    var eid = del.dataset.eid;
    jdel('/experiments/'+eid).then(function(){
      experiments = experiments.filter(function(e){ return e.id!==eid; });
      renderExpList();
    }).catch(function(){});
    return;
  }
  var row = ev.target.closest('.ei');
  if(row && row.dataset.convId){
    var c = findConv(row.dataset.convId);
    if(c){ switchConv(c.id); }
  }
});

document.getElementById('exp-hdr').addEventListener('click', function(){
  expSection.classList.toggle('open');
});

function triggerProcess(convId){
  jpost('/convs/'+convId+'/process',{}).then(function(r){
    if(!r) return;
    // update experiment panel
    if(r.experiment){
      experiments.unshift(r.experiment);
      renderExpList();
      if(!expSection.classList.contains('open')) expSection.classList.add('open');
    }
    // auto-rename conversation if still default
    if(r.newTitle){
      var conv = findConv(convId);
      if(conv && (conv.name==='New conversation'||conv.name==='新对话')){
        conv.name = r.newTitle;
        renderConvList(document.getElementById('conv-search').value);
      }
    }
  }).catch(function(){});
}

/* ── Markdown setup ── */
(function(){
  if(typeof marked === 'undefined') return;
  var renderer = new marked.Renderer();
  renderer.code = function(code, lang) {
    // marked v9 passes an object token; earlier passes (code, lang) directly
    var text = (typeof code === 'object' && code !== null) ? code.text : code;
    var language = (typeof code === 'object' && code !== null) ? code.lang : lang;
    language = language && hljs.getLanguage(language) ? language : 'plaintext';
    var highlighted;
    try { highlighted = hljs.highlight(text, {language: language}).value; }
    catch(e) { highlighted = esc(text); }
    return '<pre><button type="button" class="cp-btn">Copy</button>'
         + '<code class="hljs language-'+language+'">'
         + highlighted
         + '</code></pre>';
  };
  marked.use({ renderer: renderer, breaks: true, gfm: true });
})();

function renderMarkdown(text){
  if(!text) return '';
  try{
    var html = (typeof marked !== 'undefined') ? marked.parse(text) : esc(text).replace(/\n/g,'<br>');
    return (typeof DOMPurify !== 'undefined')
      ? DOMPurify.sanitize(html, {ADD_TAGS:['button'],ADD_ATTR:['type','class']})
      : html;
  } catch(e){ return esc(text).replace(/\n/g,'<br>'); }
}

/* RAF-throttled re-render during streaming (avoid thrashing on every chunk) */
var _rafPending = false;
var _rafBub = null;
var _rafText = '';
function queueRender(bub, text){
  _rafBub = bub; _rafText = text;
  if(_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(function(){
    _rafPending = false;
    if(!_rafBub) return;
    _rafBub.innerHTML = renderMarkdown(_rafText);
    // Re-attach blinking cursor after re-render
    if(_rafBub.classList.contains('streaming')){
      var cur = document.createElement('span');
      cur.className = 'stream-cur';
      _rafBub.appendChild(cur);
    }
  });
}

/* ── DOM ── */
var appEl      = document.getElementById('app');
var convListEl = document.getElementById('conv-list');
var searchEl   = document.getElementById('conv-search');
var msgsEl     = document.getElementById('msgs');
var emptyEl    = document.getElementById('empty');
var msgsWrap   = document.getElementById('msgs-wrap');
var attBtn     = document.getElementById('att-btn');
var attMenu    = document.getElementById('att-menu');
var attChips   = document.getElementById('att-chips');
var fiImg      = document.getElementById('fi-img');
var fiTxt      = document.getElementById('fi-txt');
var sdot       = document.getElementById('sdot');
var modelName  = document.getElementById('model-name');
var themeBtn   = document.getElementById('theme-btn');
var themeIco   = document.getElementById('theme-ico');
var themeLbl   = document.getElementById('theme-lbl');
var sbToggle   = document.getElementById('sb-toggle');
var newBtn     = document.getElementById('new-btn');
var msgTa      = document.getElementById('msg-ta');
var sendBtn    = document.getElementById('send-btn');

/* ── State ── */
var ws           = null;
var isStreaming  = false;
var convs        = [];          // [{id,sessionFile,name,msgs,tools}]
var curId        = null;
var pendImgs     = [];          // [{name,dataUrl}]
var pendTxts     = [];          // [{name,content}]
var toolEls      = {};          // toolCallId -> DOM el
var agentEl            = null;   // current streaming bubble
var inAgentRun         = false;  // true only between agent_start and agent_end
var pendingTurn        = false;  // turn_start received but no assistant content yet
var curAssistantMsgId  = null;   // id of the in-progress assistant message
var initDone           = false;  // flag: first get_state handled

/* ── Theme ── */
var THEMES = ['auto','dark','light'];
var TNAMES = {auto:'Auto theme',dark:'Dark theme',light:'Light theme'};
var TICONS = {auto:'🌓',dark:'🌙',light:'☀️'};
var themeIdx = 0;

function applyTheme(i){
  themeIdx = i;
  var t = THEMES[i];
  document.documentElement.setAttribute('data-theme', t);
  themeIco.textContent = TICONS[t];
  themeLbl.textContent = TNAMES[t];
  localStorage.setItem('wad-theme', i);
  // Swap highlight.js stylesheet to match theme
  var hljsCss = document.getElementById('hljs-css');
  if(hljsCss){
    var isDark = t==='dark' || (t==='auto' && window.matchMedia('(prefers-color-scheme:dark)').matches);
    hljsCss.href = isDark
      ? 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css'
      : 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css';
  }
}
(function(){var s=localStorage.getItem('wad-theme'); applyTheme(s!==null?+s:0);})();
themeBtn.addEventListener('click',function(){ applyTheme((themeIdx+1)%THEMES.length); });

/* ── Sidebar toggle ── */
sbToggle.addEventListener('click',function(){ appEl.classList.toggle('sb-off'); });
newBtn.addEventListener('click', startNewConv);

/* ── Helpers ── */
function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function scrollBot(){ msgsWrap.scrollTop = msgsWrap.scrollHeight; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setStatus(s){ sdot.className='sdot '+(s||''); }

/* ── Persistence: server SQLite (falls back to localStorage on error) ── */

function loadConvsLegacy(){
  try{
    var raw=localStorage.getItem(LS_KEY); if(!raw) return;
    var d=JSON.parse(raw);
    convs=(d.convs||[]).map(function(c){
      return {id:c.id,sessionFile:c.sessionFile||null,name:c.name||'New conversation',msgs:(c.msgs||[]).map(function(m){return {id:m.id||uid(),role:m.role,content:m.content,atts:m.atts||[]};}).slice(-200),tools:{}};
    });
    curId=d.curId||null;
  }catch(e){ convs=[]; curId=null; }
}

/* Fetch all convs+messages from server; migrate legacy localStorage if needed */
function initFromServer(){
  return apiFetch('/convs').then(function(data){
    if(data.length===0){
      // Check for localStorage data to migrate
      var raw=localStorage.getItem(LS_KEY);
      if(raw){
        var d; try{ d=JSON.parse(raw); }catch(e){ d=null; }
        if(d&&d.convs&&d.convs.length>0){
          convs=d.convs.map(function(c){
            return {id:c.id,sessionFile:c.sessionFile||null,name:c.name||'New conversation',msgs:(c.msgs||[]).map(function(m){return {id:m.id||uid(),role:m.role,content:m.content||'',atts:m.atts||[]};}).slice(-200),tools:{}};
          });
          curId=d.curId||convs[0].id;
          // Push to server
          var tasks=convs.map(function(c){
            return apiCreateConv(c).then(function(){
              return Promise.all(c.msgs.map(function(m){
                return syncMsg(c.id,m)||Promise.resolve();
              }));
            });
          });
          return Promise.all(tasks).then(function(){
            localStorage.removeItem(LS_KEY);
          });
        }
      }
      // No legacy data — start fresh; a placeholder is created later in init
      convs=[]; curId=null;
      return;
    }
    // Populate in-memory state from server data
    convs=data.map(function(c){
      return {id:c.id,sessionFile:c.session_file||null,name:c.name||'New conversation',msgs:(c.msgs||[]).map(function(m){return {id:m.id,role:m.role,content:m.content,atts:m.atts||[]};}),tools:{}};
    });
    curId=data[0].id;
  });
}

/* ── Conversation management ── */
function findConv(id){ return convs.find(function(c){return c.id===id;}); }
function findConvByFile(f){ return convs.find(function(c){return c.sessionFile===f;}); }

function currentConv(){ return findConv(curId); }

function renderConvList(filter){
  var q = (filter||'').toLowerCase();
  convListEl.innerHTML = '';
  convs.forEach(function(c){
    if(q && c.name.toLowerCase().indexOf(q)===-1) return;
    var item = document.createElement('div');
    item.className = 'ci'+(c.id===curId?' active':'');
    item.setAttribute('data-id', c.id);

    var ico = document.createElement('span');
    ico.className = 'ci-ico';
    ico.innerHTML = '<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';

    var nameSpan = document.createElement('span');
    nameSpan.className = 'ci-name';
    nameSpan.textContent = c.name;
    nameSpan.title = 'Double-click to rename';

    // double-click to inline rename
    nameSpan.addEventListener('dblclick', function(e){
      e.stopPropagation();
      startRename(c, item, nameSpan);
    });

    var del = document.createElement('button');
    del.className = 'ci-del';
    del.title = 'Remove';
    del.innerHTML = '<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    del.addEventListener('click', function(e){
      e.stopPropagation();
      removeConv(c.id);
    });

    item.appendChild(ico);
    item.appendChild(nameSpan);
    item.appendChild(del);
    item.addEventListener('click', function(e){
      if(e.target.closest('.ci-del')) return;
      if(e.target.classList.contains('ci-name-input')) return;
      switchConv(c.id);
    });
    convListEl.appendChild(item);
  });
}

function startRename(conv, item, nameSpan){
  var input = document.createElement('input');
  input.type = 'text';
  input.className = 'ci-name-input';
  input.value = conv.name;
  input.maxLength = 80;
  nameSpan.replaceWith(input);
  input.focus();
  input.select();

  function commit(){
    var v = input.value.trim() || conv.name;
    conv.name = v;
    var span = document.createElement('span');
    span.className = 'ci-name';
    span.textContent = v;
    span.title = 'Double-click to rename';
    span.addEventListener('dblclick',function(e){
      e.stopPropagation();
      startRename(conv, item, span);
    });
    input.replaceWith(span);
    syncConvMeta(conv, {name: v});
    if(conv.id === curId && ws && ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify({type:'set_session_name',name:v,id:uid()}));
    }
  }

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); input.blur(); }
    if(e.key==='Escape'){ input.value=conv.name; input.blur(); }
  });
}

function removeConv(id){
  convs = convs.filter(function(c){ return c.id!==id; });
  if(curId===id){
    curId = convs.length>0 ? convs[0].id : null;
    if(curId) switchConv(curId, true); else showEmpty();
  }
  renderConvList(searchEl.value);
  apiDeleteConv(id);
}

function switchConv(id, noSend){
  var conv = findConv(id);
  if(!conv) return;
  curId = id;
  agentEl = null;
  isStreaming = false;
  toolEls = {};
  renderConvList(searchEl.value);
  renderMessages(conv);
  if(!noSend && conv.sessionFile && ws && ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify({type:'switch_session',sessionPath:conv.sessionFile,id:uid()}));
  }
}

function showEmpty(){
  msgsEl.classList.add('d-none');
  msgsEl.innerHTML='';
  emptyEl.classList.remove('d-none');
}

function renderMessages(conv){
  msgsEl.innerHTML = '';
  if(!conv||conv.msgs.length===0){
    showEmpty(); return;
  }
  emptyEl.classList.add('d-none');
  msgsEl.classList.remove('d-none');
  conv.msgs.forEach(function(m){
    appendBubble(m.role, m.content, m.atts);
  });
  scrollBot();
}

/* ── Message rendering ── */
function appendBubble(role, text, atts){
  emptyEl.classList.add('d-none');
  msgsEl.classList.remove('d-none');
  var row = document.createElement('div');
  row.className = 'mrow '+role;
  var hdr = document.createElement('div');
  hdr.className = 'mhdr';
  var av = document.createElement('div');
  av.className = 'mav';
  av.textContent = role==='user'?'U':'W';
  var au = document.createElement('span');
  au.className = 'mauth';
  au.textContent = role==='user'?'You':'Waddington';
  hdr.appendChild(av); hdr.appendChild(au);
  row.appendChild(hdr);
  if(atts&&atts.length){
    atts.forEach(function(a){
      var chip=document.createElement('div');
      chip.className='att-chip';
      chip.innerHTML='<span>'+(a.type==='image'?'🖼️':'📄')+'</span><span class="att-name">'+esc(a.name)+'</span>';
      row.appendChild(chip);
    });
  }
  var bub=document.createElement('div');
  if(role==='assistant'){
    bub.className='mbub md-body';
    if(text) bub.innerHTML=renderMarkdown(text);
  } else {
    bub.className='mbub';
    bub.textContent=text||'';
  }
  row.appendChild(bub);
  msgsEl.appendChild(row);
  scrollBot();
  return row;
}

function appendTool(name, callId){
  emptyEl.classList.add('d-none');
  msgsEl.classList.remove('d-none');
  var p=document.createElement('div');
  p.className='tpill';
  p.innerHTML='<span class="spin">⚙</span> '+esc(name||'tool')+'…';
  msgsEl.appendChild(p);
  scrollBot();
  if(callId) toolEls[callId]=p;
  return p;
}

function extractText(msg){
  if(!msg||!msg.content) return '';
  var s='';
  msg.content.forEach(function(b){ if(b.type==='text') s+=b.text; });
  return s;
}

/* ── New conversation ── */
function startNewConv(){
  var c={id:uid(),sessionFile:null,name:'New conversation',msgs:[],tools:{}};
  convs.unshift(c);
  curId=c.id;
  agentEl=null; isStreaming=false; toolEls={};
  renderConvList(searchEl.value);
  showEmpty();
  apiCreateConv(c);
  if(ws && ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify({type:'new_session',id:uid()}));
  }
  msgTa.focus();
}

/* ── Pi RPC event handler ── */
function handleEvent(evt){
  var conv = currentConv();
  switch(evt.type){

    case 'agent_start':
      inAgentRun=true; pendingTurn=false;
      setStatus('busy'); isStreaming=true;
      sendBtn.disabled=false;
      sendBtn.classList.add('stop');
      sendBtn.title='Stop';
      sendBtn.innerHTML='<svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>';
      break;

    case 'agent_end':
      inAgentRun=false; pendingTurn=false;
      setStatus('ok'); isStreaming=false;
      sendBtn.classList.remove('stop');
      sendBtn.title='Send';
      sendBtn.innerHTML='<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
      sendBtn.disabled=!msgTa.value.trim();
      if(agentEl){ agentEl.querySelector('.mbub').classList.remove('streaming'); agentEl=null; }
      curAssistantMsgId=null;
      // Background: extract experiment + generate rolling summary
      if(curId) triggerProcess(curId);
      break;

    case 'turn_start':
      // Defer bubble creation until first assistant content arrives (Pi fires
      // an initial turn_start before replaying user messages into context).
      if(inAgentRun) pendingTurn=true;
      break;

    case 'turn_end':
      pendingTurn=false;
      break;

    case 'message_update':{
      if(!evt.message) break;
      var role=evt.message.role;
      if(role==='user'||role==='tool') break;
      var t=extractText(evt.message);
      if(!t) break;
      // Lazily create the response bubble on first real assistant content
      if(!agentEl&&pendingTurn){
        agentEl=appendBubble('assistant','');
        agentEl.querySelector('.mbub').classList.add('streaming');
        curAssistantMsgId=uid();
        if(conv) conv.msgs.push({id:curAssistantMsgId,role:'assistant',content:'',atts:[]});
      }
      if(agentEl){
        queueRender(agentEl.querySelector('.mbub'), t);
        if(conv&&conv.msgs.length>0) conv.msgs[conv.msgs.length-1].content=t;
        scrollBot();
      }
      break;
    }

    case 'message_end':{
      if(!evt.message) break;
      var role2=evt.message.role;
      if(role2==='user'||role2==='tool') break;
      var t2=extractText(evt.message);
      if(agentEl){
        var bub2=agentEl.querySelector('.mbub');
        _rafPending=false; _rafBub=null;
        if(t2) bub2.innerHTML=renderMarkdown(t2);
        bub2.classList.remove('streaming');
      }
      if(conv&&conv.msgs.length>0&&t2){
        conv.msgs[conv.msgs.length-1].content=t2;
        // Persist finalized assistant message
        if(curAssistantMsgId)
          syncMsg(conv.id,{id:curAssistantMsgId,role:'assistant',content:t2,atts:[]});
      }
      break;
    }

    case 'pi_error':
      appendTool('⚠ '+esc(evt.text||'Agent error'));
      break;

    case 'tool_execution_start':
      appendTool(evt.toolName, evt.toolCallId);
      break;

    case 'tool_execution_end':{
      var p=toolEls[evt.toolCallId];
      if(p){
        p.classList.add(evt.isError?'err':'done');
        p.innerHTML=(evt.isError?'✗':'✓')+' '+esc(evt.toolName||'tool');
        delete toolEls[evt.toolCallId];
      }
      break;
    }

    case 'session_info_changed':
      if(conv&&evt.name&&evt.name!==conv.name){
        conv.name=evt.name;
        renderConvList(searchEl.value);
        syncConvMeta(conv,{name:evt.name});
      }
      break;

    case 'response':
      if(evt.command==='get_state'&&evt.success&&evt.data){
        var d=evt.data;
        if(d.model) modelName.textContent='Waddington  ·  '+(d.model.id||'');

        if(!initDone){
          initDone=true;
          var existing=d.sessionFile ? findConvByFile(d.sessionFile) : null;
          if(existing){
            curId=existing.id;
          } else {
            var cur=currentConv();
            if(cur){
              cur.sessionFile=d.sessionFile||null;
              if(d.sessionName&&d.sessionName!=='New conversation') cur.name=d.sessionName;
              syncConvMeta(cur,{sessionFile:cur.sessionFile,name:cur.name});
            }
          }
          renderConvList(searchEl.value);
          renderMessages(currentConv());
        }
      }
      if(evt.command==='new_session'&&evt.success&&evt.data){
        var cur2=currentConv();
        if(cur2){
          var sf=evt.data.sessionFile||null;
          if(sf&&!cur2.sessionFile){
            cur2.sessionFile=sf;
            syncConvMeta(cur2,{sessionFile:sf});
          }
        }
      }
      break;

    case 'extension_ui_request':
      if(evt.method==='notify'){
        appendTool((evt.notifyType==='error'?'⚠ ':'ℹ ')+esc(evt.message||''));
      }
      break;
  }
}

/* ── Send message ── */
function sendMessage(){
  if(isStreaming){
    if(ws&&ws.readyState===WebSocket.OPEN)
      ws.send(JSON.stringify({type:'abort',id:uid()}));
    return;
  }
  var text=msgTa.value.trim();
  var hasAtt=pendImgs.length>0||pendTxts.length>0;
  if(!text&&!hasAtt) return;
  if(!ws||ws.readyState!==WebSocket.OPEN) return;

  var fullText=text;
  var attDisp=[];

  pendTxts.forEach(function(f){
    fullText+='\n\n```\n# '+f.name+'\n'+f.content+'\n```';
    attDisp.push({type:'text',name:f.name});
  });
  var imgs=pendImgs.map(function(f){
    attDisp.push({type:'image',name:f.name});
    return f.dataUrl;
  });

  // Ensure we have a conversation
  var conv=currentConv();
  if(!conv){
    var nc={id:uid(),sessionFile:null,name:'New conversation',msgs:[],tools:{}};
    convs.unshift(nc); curId=nc.id; conv=nc;
    apiCreateConv(nc);
  }

  // Persist user message (with a stable ID for upsert)
  var userMsgId=uid();
  conv.msgs.push({id:userMsgId,role:'user',content:fullText,atts:attDisp});
  appendBubble('user',fullText,attDisp);
  syncMsg(conv.id, {id:userMsgId,role:'user',content:fullText,atts:attDisp});

  // Auto-name from first user message
  if(conv.msgs.filter(function(m){return m.role==='user';}).length===1){
    conv.name = fullText.replace(/\n/g,' ').slice(0,52)+(fullText.length>52?'…':'');
    renderConvList(searchEl.value);
    syncConvMeta(conv, {name: conv.name});
    if(ws&&ws.readyState===WebSocket.OPEN)
      ws.send(JSON.stringify({type:'set_session_name',name:conv.name,id:uid()}));
  }

  var cmd={type:'prompt',message:fullText,id:uid()};
  if(imgs.length) cmd.images=imgs;
  ws.send(JSON.stringify(cmd));

  msgTa.value='';
  msgTa.style.height='auto';
  sendBtn.disabled=true;
  pendImgs=[]; pendTxts=[];
  attChips.innerHTML='';
  attChips.classList.remove('has');
}

/* ── Input events ── */
msgTa.addEventListener('input',function(){
  msgTa.style.height='auto';
  msgTa.style.height=Math.min(msgTa.scrollHeight,200)+'px';
  sendBtn.disabled=isStreaming?false:!msgTa.value.trim();
});
msgTa.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
});
sendBtn.addEventListener('click',sendMessage);

/* ── Suggestions ── */
document.querySelectorAll('.sugg').forEach(function(btn){
  btn.addEventListener('click',function(){
    var p=btn.getAttribute('data-p');
    if(!p) return;
    msgTa.value=p;
    msgTa.dispatchEvent(new Event('input'));
    sendMessage();
  });
});

/* ── Search ── */
searchEl.addEventListener('input',function(){ renderConvList(searchEl.value); });

/* ── Attachment ── */
attBtn.addEventListener('click',function(e){
  e.stopPropagation();
  attMenu.classList.toggle('open');
});
document.addEventListener('click',function(){ attMenu.classList.remove('open'); });

fiImg.addEventListener('change',function(){
  var f=fiImg.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(e){
    pendImgs.push({name:f.name,dataUrl:e.target.result});
    addAttChip(f.name,'image');
  };
  r.readAsDataURL(f);
  fiImg.value='';
  attMenu.classList.remove('open');
});

fiTxt.addEventListener('change',function(){
  var f=fiTxt.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(e){
    pendTxts.push({name:f.name,content:e.target.result});
    addAttChip(f.name,'text');
  };
  r.readAsText(f);
  fiTxt.value='';
  attMenu.classList.remove('open');
});

function addAttChip(name,type){
  attChips.classList.add('has');
  var chip=document.createElement('div');
  chip.className='afc';
  chip.innerHTML=(type==='image'?'🖼️ ':'📄 ')+
    '<span>'+esc(name)+'</span>'+
    '<span class="afc-rm">×</span>';
  chip.querySelector('.afc-rm').addEventListener('click',function(){
    chip.remove();
    if(!attChips.children.length) attChips.classList.remove('has');
  });
  attChips.appendChild(chip);
}

/* ── Copy-button delegation (event on msgsEl catches dynamically added buttons) ── */
msgsEl.addEventListener('click',function(e){
  var btn=e.target.closest('.cp-btn');
  if(!btn) return;
  var code=btn.parentElement.querySelector('code');
  if(!code) return;
  var text=code.textContent||'';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      btn.textContent='Copied!'; btn.classList.add('copied');
      setTimeout(function(){ btn.textContent='Copy'; btn.classList.remove('copied'); },1800);
    });
  } else {
    // Fallback for older browsers
    var ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent='Copied!'; btn.classList.add('copied');
    setTimeout(function(){ btn.textContent='Copy'; btn.classList.remove('copied'); },1800);
  }
});

/* ── WebSocket ── */
function connect(){
  ws=new WebSocket(WS_URL);

  ws.onopen=function(){
    setStatus('ok');
    sendBtn.disabled=!msgTa.value.trim();
    initDone=false;   // allow get_state to run initialization once
    ws.send(JSON.stringify({type:'get_state',id:uid()}));
    msgTa.focus();
  };

  ws.onclose=function(){
    setStatus('');
    sendBtn.disabled=true;
    setTimeout(connect,2500);
  };

  ws.onerror=function(){
    modelName.textContent='Connection error';
  };

  ws.onmessage=function(e){
    try{ handleEvent(JSON.parse(e.data)); }catch(_){}
  };
}

/* ── Init (async: fetch from server, fall back to localStorage) ── */
(function(){
  function boot(){
    if(convs.length===0){
      var first={id:uid(),sessionFile:null,name:'New conversation',msgs:[],tools:{}};
      convs.push(first); curId=first.id;
      apiCreateConv(first);
    }
    if(!findConv(curId)) curId=convs[0].id;
    renderConvList();
    renderMessages(currentConv());
    connect();
  }

  initFromServer().then(boot).catch(function(){
    // Server unreachable — fall back to localStorage
    loadConvsLegacy();
    boot();
  });
  loadExperiments();
})();

})();
</script>
